<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Offline | Spotwise</title>
<style>
  html,body{margin:0;height:100%;background:#0c1322;color:#e4e9f2;font-family:system-ui,-apple-system,Roboto,sans-serif}
  body{display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}
  .logo{width:76px;height:76px;margin:0 auto}
  h1{font-size:20px;margin:22px 0 8px} p{color:#8a97ae;margin:0 0 24px;line-height:1.5;font-size:15px}
  button{border:0;background:#7390ff;color:#fff;padding:12px 22px;border-radius:12px;font-weight:600;font-size:15px}
  button:active{opacity:.8}
</style>
</head>
<body>
  <div>
    <svg class="logo" viewBox="0 0 26 26" aria-hidden="true">
      <rect x="12" y="2" width="2" height="22" rx="1" fill="#8e9bb0"/>
      <rect x="7" y="7" width="12" height="12" rx="6" fill="#7390ff"/>
      <rect x="10.5" y="10.5" width="5" height="5" rx="2.5" fill="#0c1322"/>
    </svg>
    <h1>No internet connection</h1>
    <p>Spotwise needs internet to load live Binance prices.<br>Check your connection and try again.</p>
    <button onclick="location.href='https://spotwise-app.vercel.app/'">Try again</button>
  </div>
</body>
</html>
